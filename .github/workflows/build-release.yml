name: Build Cross-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: build-macos-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
            cmake_arch: arm64
          - os: macos-13
            arch: x64
            cmake_arch: x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: brew install cmake eigen libtiff dylibbundler
      - name: Build native GUI and create DMG
        run: bash macos/create_dmg.sh --arch ${{ matrix.cmake_arch }}
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-macos-${{ matrix.arch }}
          path: build_${{ matrix.cmake_arch }}/*.dmg
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Bolus Tracking Studio ${{ github.ref_name }}"
          files: build_${{ matrix.cmake_arch }}/*.dmg
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
